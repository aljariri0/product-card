<!doctype html>
<html>
  <head>
    <title>Product Care Layout</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="navbar">
      <a href="#">Home</a>
      <a href="#">Shop</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>

    <div class="main">
      <div class="card">
        <div class="badge">-30%</div>

        <div>
          <img src="headset.png" width="100px" height="100px" />
        </div>

        <div class="card-content">
          <h2>Aria Wireless Headphones</h2>
          <p>
            Active noise-cancelling, plush earcups, and 30 hours of battery life
            on a single charge.
          </p>

          <div class="price">
            <span class="new-price">$69.99</span>
            <span class="old-price">$99.99</span>
          </div>

          <div class="btns">
            <button class="btn">Add to Cart</button>
            <button class="btn">Add to Wishlist</button>
          </div>
        </div>
        <div class="note">Only 3 left in stock</div>
      </div>
    </div>
  </body>
</html>
